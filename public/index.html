<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Codex、GitHub、EC2 和 RDS 最小交付流程验证站点">
    <title>AWS MiniFlow</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="AWS MiniFlow 首页">
        <span class="brand-mark" aria-hidden="true">MF</span>
        <span>AWS MiniFlow</span>
      </a>
      <div class="status" id="service-status" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span>正在检查服务</span>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="eyebrow">Delivery pipeline proof</div>
        <h1 id="hero-title">从一行代码，<br>到一台正在运行的机器。</h1>
        <p class="hero-copy">
          这个最小网站用于验证 Codex 开发、GitHub 审查、容器构建、EC2 部署和 RDS 持久化是否真正连成一条线。
        </p>
        <ol class="pipeline" aria-label="交付流水线">
          <li><span>01</span>Codex</li>
          <li><span>02</span>GitHub</li>
          <li><span>03</span>ECR</li>
          <li><span>04</span>EC2</li>
          <li><span>05</span>RDS</li>
        </ol>
      </section>

      <section class="workspace" aria-labelledby="message-title">
        <div class="panel compose-panel">
          <div class="panel-heading">
            <div>
              <p class="kicker">Write path</p>
              <h2 id="message-title">写入一条验证消息</h2>
            </div>
            <span class="database-badge">PostgreSQL</span>
          </div>

          <form id="message-form">
            <label for="author">名称</label>
            <input id="author" name="author" maxlength="40" autocomplete="name" placeholder="例如：部署验证" required>

            <label for="body">消息</label>
            <textarea id="body" name="body" maxlength="280" rows="5" placeholder="如果刷新页面后仍然存在，就说明 RDS 写入和读取均正常。" required></textarea>
            <div class="form-meta">
              <span id="form-message" role="status"></span>
              <span><output id="character-count">0</output>/280</span>
            </div>
            <button type="submit">写入数据库 <span aria-hidden="true">→</span></button>
          </form>
        </div>

        <div class="panel messages-panel">
          <div class="panel-heading">
            <div>
              <p class="kicker">Read path</p>
              <h2>最近写入</h2>
            </div>
            <button class="icon-button" id="refresh-button" type="button" aria-label="刷新消息">↻</button>
          </div>
          <div id="messages" class="messages" aria-live="polite">
            <p class="empty-state">正在读取数据库…</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <span>环境：<strong>aws-miniflow</strong></span>
      <span>健康检查：<code>/health/ready</code></span>
    </footer>
  </body>
</html>
