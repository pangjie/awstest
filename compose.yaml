services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: miniflow
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d miniflow"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgres://app:app@db:5432/miniflow
      DB_SSL: disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
