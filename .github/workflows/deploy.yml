name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: aws-miniflow

jobs:
  deploy:
    name: Build ARM image and deploy through SSM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Test exact revision
        run: npm ci && npm run check

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Check whether this immutable image already exists
        id: image
        run: |
          if aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            echo 'exists=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'exists=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Enable ARM emulation
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push immutable ARM image
        if: steps.image.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ECR basic scanning scans the runnable image manifest, while Buildx
          # attestations wrap a single-platform image in an OCI index.
          provenance: false
          sbom: false

      - name: Wait for ECR basic vulnerability scan
        run: |
          aws ecr wait image-scan-complete \
            --repository-name "${ECR_REPOSITORY}" \
            --image-id "imageTag=${GITHUB_SHA}"
          aws ecr describe-image-scan-findings \
            --repository-name "${ECR_REPOSITORY}" \
            --image-id "imageTag=${GITHUB_SHA}" \
            --query '{Status:imageScanStatus.status,Severity:imageScanFindings.findingSeverityCounts}'

      - name: Deploy and wait for readiness
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          parameters="$(jq -cn --arg command "sudo /usr/local/bin/deploy-miniflow ${IMAGE_URI}" '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters "${parameters}" \
            --comment "Deploy ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: ${command_id}"
          set +e
          aws ssm wait command-executed \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}"
          wait_status=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          exit "${wait_status}"
