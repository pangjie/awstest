name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: aws-miniflow

jobs:
  deploy:
    name: Build ARM image and deploy through SSM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Verify the revision came from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merged_pr_count="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length')"
          if [ "${merged_pr_count}" -lt 1 ]; then
            echo '::error::Production deployment is allowed only for a commit associated with a merged pull request into main.'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Test exact revision
        run: npm ci && npm run check

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Check whether this immutable image already exists
        id: image
        run: |
          if aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            echo 'exists=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'exists=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Enable ARM emulation
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push immutable ARM image
        if: steps.image.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ECR basic scanning scans the runnable image manifest, while Buildx
          # attestations wrap a single-platform image in an OCI index.
          provenance: false
          sbom: false

      - name: Wait for ECR basic vulnerability scan
        run: |
          aws ecr wait image-scan-complete \
            --repository-name "${ECR_REPOSITORY}" \
            --image-id "imageTag=${GITHUB_SHA}"
          aws ecr describe-image-scan-findings \
            --repository-name "${ECR_REPOSITORY}" \
            --image-id "imageTag=${GITHUB_SHA}" \
            --query '{Status:imageScanStatus.status,Severity:imageScanFindings.findingSeverityCounts}'

      - name: Deploy and wait for readiness
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          parameters="$(jq -cn --arg command "sudo /usr/local/bin/deploy-miniflow ${IMAGE_URI}" '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters "${parameters}" \
            --comment "Deploy ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: ${command_id}"
          set +e
          aws ssm wait command-executed \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}"
          wait_status=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          exit "${wait_status}"
